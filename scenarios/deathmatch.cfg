# ViZDoom Deathmatch Configuration
# Adapted from the built-in deathmatch.cfg scenario

doom_scenario_path = ../deathmatch.wad
doom_skill = 3

# Rendering options
screen_resolution = RES_320X240
render_hud = false
render_screen_flashes = false

# Make episodes start in the first tic
episode_start_time = 1

# Make episodes finish after 4200 actions (tics)
episode_timeout = 4200

# Available buttons — only those used by the action space in src/actions.py
# (SPEED doubles both movement and turning speed)
available_buttons =
    {
        ATTACK
        SPEED

        MOVE_RIGHT
        MOVE_LEFT
        MOVE_BACKWARD
        MOVE_FORWARD
        TURN_RIGHT
        TURN_LEFT

        SELECT_NEXT_WEAPON
        SELECT_PREV_WEAPON
    }

# Game variables that will be in the state
available_game_variables =
    {
        KILLCOUNT
        HEALTH
        ARMOR
        SELECTED_WEAPON
        SELECTED_WEAPON_AMMO
        DEATHCOUNT
        HITS_TAKEN
        DAMAGE_TAKEN
        DEAD
        POSITION_X
        POSITION_Y
        HITCOUNT
        DAMAGECOUNT
        AMMO2
        AMMO3
        AMMO5
        AMMO6
    }

# AMMO2/3/5/6 are the distinct ammo pools (bullets, shells, rockets, cells);
# AMMO4 and AMMO7 share the pools of AMMO2 and AMMO6.

mode = PLAYER
