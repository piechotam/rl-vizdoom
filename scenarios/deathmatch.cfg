# ViZDoom Deathmatch Configuration
# Adapted from the built-in deathmatch.cfg scenario

doom_scenario_path = ../deathmatch.wad
doom_skill = 3

# Rendering options
screen_resolution = RES_320X240
render_hud = false
render_screen_flashes = false

# Make episodes start in the first tic
episode_start_time = 1

# Make episodes finish after 4200 actions (tics)
episode_timeout = 4200

# Available buttons (discrete only — delta axes excluded for simplicity)
available_buttons =
    {
        ATTACK
        SPEED
        STRAFE

        MOVE_RIGHT
        MOVE_LEFT
        MOVE_BACKWARD
        MOVE_FORWARD
        TURN_RIGHT
        TURN_LEFT

        SELECT_WEAPON1
        SELECT_WEAPON2
        SELECT_WEAPON3
        SELECT_WEAPON4
        SELECT_WEAPON5
        SELECT_WEAPON6

        SELECT_NEXT_WEAPON
        SELECT_PREV_WEAPON
    }

# Game variables that will be in the state
available_game_variables =
    {
        KILLCOUNT
        HEALTH
        ARMOR
        SELECTED_WEAPON
        SELECTED_WEAPON_AMMO
    }

mode = PLAYER
