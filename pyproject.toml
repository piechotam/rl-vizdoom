[project]
name = "uzw"
version = "0.1.0"
description = "Reinforcement learning agents for ViZDoom deathmatch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "vizdoom>=1.3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
]
# Line length is handled by `ruff format`; long f-strings are left as-is
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts add the repo root to sys.path before importing src
"scripts/*" = ["E402"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
